# Build the image, run the tests in it, push it to GHCR.
#   push to main:      tag "latest"
#   tag v<version>:    tags "<kicad version>" and "<kicad version>-<version>"
#   pull request:      build and test only
name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kicad-builder

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Versions
        id: v
        run: |
          kicad="$(sed -n 's/^ARG KICAD_VERSION=//p' Dockerfile)"
          builder="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/kicad_fab/__init__.py)"
          echo "kicad=$kicad" >> "$GITHUB_OUTPUT"
          echo "builder=$builder" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${builder}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not agree with kicad-fab version ${builder}"
            exit 1
          fi

      - name: Build
        run: |
          docker build --pull \
            --build-arg KICAD_VERSION=${{ steps.v.outputs.kicad }} \
            --build-arg BUILDER_VERSION=${{ steps.v.outputs.builder }} \
            -t kicad-builder:test .

      - name: Tests
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/src -w /src \
            kicad-builder:test python3 -m pytest -v

      - name: Entrypoint (no arguments builds /workspace)
        run: |
          cp -r tests/projects/demo "$RUNNER_TEMP/demo"
          docker run --rm -u "$(id -u):$(id -g)" -v "$RUNNER_TEMP/demo":/workspace kicad-builder:test
          test -f "$RUNNER_TEMP/demo/build/manifest.json"
          docker run --rm kicad-builder:test bash -c 'kicad-cli version && pandoc --version | head -1'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag kicad-builder:test "$IMAGE:latest"
          docker push "$IMAGE:latest"

      - name: Push version tags
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          for tag in "${{ steps.v.outputs.kicad }}" "${{ steps.v.outputs.kicad }}-${{ steps.v.outputs.builder }}"; do
            docker tag kicad-builder:test "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
