# Reusable workflow for board repositories: on a tag, make the fabrication files and
# a GitHub release. The release text has the renders (uploaded as release assets) and
# the commits since the previous tag. The release ZIP has the Gerbers (board and panel),
# BOMs, CPLs, STEP, renders, schematic PDF and manifest.
# The caller runs it on "push: tags". See README.md for an example caller.
name: Board release

on:
  workflow_call:
    inputs:
      image:
        description: kicad-builder image
        type: string
        default: ghcr.io/slintak/kicad-builder:latest
      directory:
        description: Directory of the KiCad project in the repository
        type: string
        default: "."
      args:
        description: More arguments for "kicad-fab build"
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: kicad-fab build
        env:
          DIR: ${{ inputs.directory }}
          ARGS: ${{ inputs.args }}
        run: |
          git config --global --add safe.directory '*'
          # shellcheck disable=SC2086
          kicad-fab build $ARGS "$DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: ${{ inputs.directory }}/build
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag must be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::run this workflow on a tag"; exit 1
          fi
          git fetch origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::tag ${GITHUB_REF_NAME} is not on the branch ${DEFAULT_BRANCH}"; exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files

      - name: Release notes
        id: notes
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          board="$(python3 -c 'import json; print(json.load(open("release-files/manifest.json"))["board"])')"
          dno="$(python3 -c 'import json; print(json.load(open("release-files/manifest.json"))["do_not_order"])')"
          previous="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          assets="release-assets"
          mkdir -p "$assets"
          cp release-files/*.zip "$assets/"
          {
            echo "## ${board} ${tag}"
            echo
            if [ "$dno" = "True" ]; then
              echo "> **DO NOT ORDER.** This release is a work in progress or has check errors (see manifest.json)."
              echo
            fi
            for view in top bottom preview; do
              png="release-files/render/${board}-${view}.png"
              if [ -f "$png" ]; then
                cp "$png" "$assets/"
                echo "![${view}](${REPO_URL}/releases/download/${tag}/${board}-${view}.png)"
              fi
            done
            if [ -f "release-files/panel/${board}_panel.png" ]; then
              cp "release-files/panel/${board}_panel.png" "$assets/"
              echo
              echo "Panel:"
              echo
              echo "![panel](${REPO_URL}/releases/download/${tag}/${board}_panel.png)"
            fi
            echo
            if [ -n "$previous" ]; then
              echo "### Changes since ${previous}"
              echo
              git log --no-merges --pretty='- %s (%h)' "${previous}..${tag}"
            else
              echo "### Changes"
              echo
              git log --no-merges --pretty='- %s (%h)' "${tag}"
            fi
          } > notes.md
          echo "prerelease=$([ "$dno" = "True" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          cat notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          if [ "${{ steps.notes.outputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" release-assets/* --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --verify-tag $flags
