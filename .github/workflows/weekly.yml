# Each week: build the image with the newest KiCad 10 package of the PPA and the
# newest KiKit release, then run the tests. A failure opens (or updates) an issue.
# This job does not push an image.
name: Weekly newest versions

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  newest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the image is large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Newest KiKit release
        id: kikit
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "ref=$(gh api repos/yaqwsx/KiKit/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          docker build --pull --build-arg KICAD_VERSION=latest \
            --build-arg KIKIT_REF=${{ steps.kikit.outputs.ref }} -t kicad-builder:newest .
          docker run --rm kicad-builder:newest kicad-fab versions | tee versions.json

      - name: Tests
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/src -w /src \
            kicad-builder:newest python3 -m pytest -v 2>&1 | tee pytest.log

      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Weekly test with the newest KiCad and KiKit failed"
          {
            echo "The tests failed with the newest versions: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            cat versions.json 2>/dev/null || echo "no versions (the build failed)"
            echo '```'
            echo
            echo '```'
            tail -n 40 pytest.log 2>/dev/null || true
            echo '```'
          } > body.md
          number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
